Foreground yes
User clamav
LocalSocket /tmp/clamd.sock
LocalSocketMode 600
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LogTime yes
LogClean no
LogVerbose no
MaxThreads 2
MaxQueue 4
StreamMaxLength 20M
MaxFileSize 20M
MaxScanSize 40M
MaxScanTime 60000
AlertExceedsMax yes
AlertEncrypted yes
SelfCheck 300
ConcurrentDatabaseReload no
